<!DOCTYPE html>
<!-- MOCK ONLY. Sana thread UI rebuild, 2026-09-06. Untracked by design, never git added.
     Fixes the four live defects in dashboard.html:
       :6569  a per-turn element id that is never cleared         -> local reference + data-turn
       :6570  getElementById resolves to the FIRST match          -> no element id at all
       :6627  '<p>' + esc(answer) + '</p>'                        -> sanaRender()
       :6653  .sana-row emitted before .sana-thread               -> thread above, row pinned below
     sanaRender() below is the function the build lifts verbatim. -->
<html lang="en-IN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mock, Sana thread</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#FAF8F4; --teal:#0C8E6B; --teal-dark:#097A5B; --teal-light:#E3F5EE;
  --coral:#D47C65; --amber:#DEA04A; --brown:#47372B; --brown-mid:#6B5047;
  --brown-light:#EDE4DA; --white:#FFFFFF; --off-white:#FDFBF8;
  --shadow:0 18px 50px -24px rgba(71,55,43,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Instrument Sans',sans-serif;background:var(--cream);color:var(--brown);
     line-height:1.6;-webkit-font-smoothing:antialiased;padding:40px 20px 80px}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.wrap{max-width:640px;margin:0 auto}
.mock-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--brown-mid);margin-bottom:12px}
.mock-note{font-size:12px;color:var(--brown-mid);line-height:1.7;margin-top:14px;font-style:italic}

/* ── the card ─────────────────────────────────────────────────────────────
   THREAD ABOVE ROW. The live file emits .sana-row first, so the conversation
   grows away from the box you type in. */
.sana-card{background:var(--off-white);border:1px solid var(--brown-light);border-radius:20px;
  padding:18px 18px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column}

.sana-thread{max-height:60vh;overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;margin-bottom:14px}
.sana-thread::-webkit-scrollbar{width:8px}
.sana-thread::-webkit-scrollbar-thumb{background:var(--brown-light);border-radius:8px}

.sana-turn{margin-bottom:16px;max-width:86%}
.sana-turn:last-child{margin-bottom:4px}

/* user turn, right aligned, brown 8% tint */
.sana-turn.sana-you{margin-left:auto;background:rgba(71,55,43,.08);border-radius:14px;
  padding:10px 14px;color:var(--brown);font-size:15px}

/* Sana turn, left aligned, 2px teal left rule. The live file has NO .sana-her rule at all. */
.sana-turn.sana-her{margin-right:auto;border-left:2px solid var(--teal);
  padding:2px 0 2px 14px;font-size:15px;color:var(--brown)}
.sana-her .sana-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--teal);margin-bottom:5px}
.sana-her p{margin-bottom:10px}
.sana-her p:last-child{margin-bottom:0}
.sana-her strong{font-weight:600;color:var(--brown)}
.sana-her ul,.sana-her ol{margin:0 0 10px 20px}
.sana-her li{margin-bottom:5px}

.sana-dots{display:flex;gap:5px;align-items:center;padding:5px 0}
.sana-dots span{width:6px;height:6px;border-radius:50%;background:var(--teal);
  animation:sanaPulse 1s ease-in-out infinite}
.sana-dots span:nth-child(2){animation-delay:.15s}
.sana-dots span:nth-child(3){animation-delay:.3s}
@keyframes sanaPulse{0%,100%{opacity:.3}50%{opacity:1}}

/* row pinned at the card bottom */
.sana-row{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--brown-light);
  padding-top:12px;margin-top:auto}
.sana-input{flex:1 1 auto;resize:none;min-height:42px;max-height:120px;border:1px solid var(--brown-light);
  border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;color:var(--brown);
  background:var(--white);line-height:1.5}
.sana-input:focus{outline:none;border-color:var(--teal)}
.sana-send{flex:0 0 auto;border-radius:12px;padding:11px 18px;font:inherit;font-size:14px;
  font-weight:600;color:var(--white);background:var(--teal)}
.sana-send:hover{background:var(--teal-dark)}
.sana-send[disabled]{opacity:.55;cursor:default}

.mock-ctl{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.mock-btn{border:1px solid var(--brown-light);background:var(--white);border-radius:10px;
  padding:8px 14px;font-size:13px;font-weight:600;color:var(--brown)}
.mock-btn.accent{border-color:var(--amber);color:#8A6420}

@media(max-width:420px){
  body{padding:20px 12px 60px}
  .wrap{max-width:100%}
  .sana-turn{max-width:100%}
  .sana-thread{max-height:60vh}
  .sana-row{flex-direction:column;align-items:stretch}
  .sana-send{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mock-title">Mock, Sana thread</div>

  <div class="sana-card">
    <div class="sana-thread" id="sana-thread"></div>
    <div class="sana-row">
      <textarea class="sana-input" id="sana-input" rows="1" placeholder="Ask Sana about your panel" aria-label="Ask Sana about your panel"></textarea>
      <button class="sana-send" id="sana-send" type="button">Ask</button>
    </div>
  </div>

  <div class="mock-ctl">
    <button class="mock-btn accent" id="mock-finish" type="button">Finish the in flight turn</button>
    <button class="mock-btn" id="mock-add" type="button">Send another</button>
  </div>

  <p class="mock-note">The in flight turn holds a local reference, not an id. Press Finish and watch
  the three completed turns above stay byte identical. The console asserts it.</p>
</div>

<script>
// ── sanaRender ────────────────────────────────────────────────────────────
// THE FUNCTION THE BUILD LIFTS VERBATIM. Escape FIRST, then apply a closed set
// of marks. No headings, no links, no raw HTML: everything the model emits is
// text until this function decides otherwise, which is why escaping comes first
// and never after.
function sanaRender(text){
  var esc = String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  var blocks = esc.split(/\n\s*\n/);
  var out = "";

  for (var b = 0; b < blocks.length; b++){
    var block = blocks[b].replace(/^\n+|\n+$/g, "");
    if (!block) continue;
    var lines = block.split("\n");

    var allNum = lines.length > 0 && lines.every(function(l){ return /^\s*\d+[.)]\s+/.test(l); });
    var allBul = lines.length > 0 && lines.every(function(l){ return /^\s*[-*]\s+/.test(l); });

    if (allNum){
      out += "<ol>";
      for (var i = 0; i < lines.length; i++)
        out += "<li>" + bold(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>";
      out += "</ol>";
    } else if (allBul){
      out += "<ul>";
      for (var j = 0; j < lines.length; j++)
        out += "<li>" + bold(lines[j].replace(/^\s*[-*]\s+/, "")) + "</li>";
      out += "</ul>";
    } else {
      out += "<p>" + bold(lines.join(" ")) + "</p>";
    }
  }
  return out;

  // Bold only. Applied AFTER escaping, so a literal asterisk in the source can
  // never introduce markup that was not already escaped.
  function bold(s){ return s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
}

// ── thread plumbing ───────────────────────────────────────────────────────
var thread = document.getElementById("sana-thread");
var TURN = 0;

function scrollToBottom(){ thread.scrollTop = thread.scrollHeight; }

function appendUser(text){
  var el = document.createElement("div");
  el.className = "sana-turn sana-you";
  el.setAttribute("data-turn", ++TURN);
  el.textContent = text;
  thread.appendChild(el);
  scrollToBottom();
  return el;
}

// Creates the Sana element and RETURNS IT. The caller holds the reference for
// the life of the turn. Nothing is looked up by id, so a second turn cannot
// resolve to the first one's element.
function appendSana(){
  var el = document.createElement("div");
  el.className = "sana-turn sana-her";
  el.setAttribute("data-turn", TURN);
  el.innerHTML = '<div class="sana-label">Sana</div>' +
                 '<div class="sana-dots" aria-hidden="true"><span></span><span></span><span></span></div>';
  thread.appendChild(el);
  scrollToBottom();
  return el;
}

function resolveTurn(el, text){
  var dots = el.querySelector(".sana-dots");
  if (dots) dots.remove();
  var body = document.createElement("div");
  body.innerHTML = sanaRender(text);
  el.appendChild(body);
  scrollToBottom();
}

// A mock sanaSend. Same shape as the real one minus the network.
var pending = null;
function sanaSend(text){
  appendUser(text);
  pending = appendSana();          // local reference, held here
  return pending;
}

// ── sample copy ───────────────────────────────────────────────────────────
// No em dashes. No colons in body copy. No reassuring-band vocabulary. American spelling.
var T1_Q = "What does my ferritin result mean for my energy?";
var T1_A = "Your ferritin came back inside the reference range for this panel, so iron stores are not " +
  "showing as low here. That said, energy has many inputs and one marker in range does not rule out " +
  "the tiredness you are describing.\n\nIf the fatigue is persistent, that is worth raising with your " +
  "clinician, who can look at this alongside how you actually feel.";

var T2_Q = "Is there anything in my heavy metals results I should worry about?";
var T2_A = "Your heavy metals panel was scored and every marker in it came back within range, so nothing " +
  "in this group is flagged for you today.\n\nI want to be plain about how I treat this group rather " +
  "than sound reassuring by default. Heavy metals are **not a wellness finding**. A band here would be " +
  "a reason to involve a clinician rather than something to read as a lifestyle note, so if a future " +
  "panel moves in this group I will say so directly and point you to your doctor.";

var T3_Q = "What should I actually do next?";
var T3_A = "Three things worth your attention, in the order I would take them.\n\n" +
  "- Bring the tiredness to your clinician and mention that **ferritin is in range**, because that " +
  "changes what they look at next\n" +
  "- Keep your next panel about twelve weeks out so any change has room to show\n" +
  "- Log how you sleep for a fortnight, since that is the input most likely to move how you feel";

var T4_Q = "Does the timing of the blood draw matter for these?";

// ── seed three completed pairs plus one in flight turn ────────────────────
(function seed(){
  var a = sanaSend(T1_Q); resolveTurn(a, T1_A);
  var b = sanaSend(T2_Q); resolveTurn(b, T2_A);
  var c = sanaSend(T3_Q); resolveTurn(c, T3_A);
  sanaSend(T4_Q);                  // left in flight, dots showing
  scrollToBottom();
})();

// ── the assertion the live bug would fail ─────────────────────────────────
document.getElementById("mock-finish").onclick = function(){
  if (!pending){ console.log("[mock] nothing in flight"); return; }

  var priors = Array.prototype.slice.call(thread.querySelectorAll(".sana-turn"))
                 .filter(function(el){ return el !== pending; });
  var before = priors.map(function(el){ return el.innerHTML; });

  resolveTurn(pending, "Timing matters for some markers more than others. Fasting moves glucose and " +
    "lipids, and a recent hard training session can lift some muscle markers for a day or two.\n\n" +
    "Your draw context is already recorded against this panel, so the reading you are seeing accounts " +
    "for what you told us.");

  var after = priors.map(function(el){ return el.innerHTML; });
  var untouched = before.length === after.length && before.every(function(h, i){ return h === after[i]; });

  console.assert(untouched, "[mock] PRIOR TURNS MUTATED. This is the live shared-element-id defect.");
  console.log("[mock] prior turns untouched:", untouched, "(" + before.length + " checked)");

  pending = null;
  this.disabled = true;
};

document.getElementById("mock-add").onclick = function(){
  if (pending){ console.log("[mock] finish the in flight turn first"); return; }
  var el = sanaSend("And what about vitamin D?");
  setTimeout(function(){
    resolveTurn(el, "Vitamin D was not part of this panel, so I have nothing scored for it here. " +
      "It is a reasonable one to add next time if you and your clinician think it is useful.");
    pending = null;
  }, 1200);
  document.getElementById("mock-finish").disabled = false;
};
</script>
</body>
</html>
