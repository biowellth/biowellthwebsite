<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>BioWellth · Create your account</title>
<meta http-equiv="refresh" content="0; url=/login?mode=signup"/>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    q.set("mode", "signup");
    location.replace("/login?" + q.toString());
  }catch(_){
    location.replace("/login?mode=signup");
  }
})();
</script>
</head>
<body>
<p><a href="/login?mode=signup">Continue to create your account</a></p>
</body>
</html>
