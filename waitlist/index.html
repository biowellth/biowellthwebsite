<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Get early access · BioWellth</title>
<meta name="robots" content="noindex"/>
<link rel="canonical" href="https://biowellth.ai/early-access/"/>
<script>
(function(){
  var PATH = "/", HASH = "#early-access";
  var raw = location.search.replace(/^\?/, "");
  try{
    var q = new URLSearchParams(raw);
    var add = null;
    if(!q.has("utm_source")){
      var ua = navigator.userAgent || "";
      var host = "";
      try{ host = document.referrer ? new URL(document.referrer).hostname.toLowerCase() : ""; }catch(_){}
      var ref = ["substack.com","linkedin.com","youtube.com"].filter(function(d){
        return host === d || host.slice(-(d.length + 1)) === "." + d;
      })[0];
      if(ua.indexOf("Instagram") !== -1) add = {utm_source:"ig", utm_medium:"social", utm_content:"link_in_bio"};
      else if(q.has("fbclid"))           add = {utm_source:"meta", utm_medium:"social", utm_content:"link_in_bio"};
      else if(ref)                       add = {utm_source:ref, utm_medium:"referral"};
      else                               add = {utm_source:"direct", utm_medium:"web", utm_content:"waitlist"};
    }
    var extra = [];
    if(add) for(var k in add) if(!q.has(k)) extra.push(k + "=" + encodeURIComponent(add[k]));
    var query = [raw, extra.join("&")].filter(Boolean).join("&");
    location.replace(PATH + (query ? "?" + query : "") + HASH);
  }catch(_){
    location.replace(PATH + (raw ? "?" + raw : "?utm_source=direct&utm_medium=web&utm_content=waitlist") + HASH);
  }
})();
</script>
<meta http-equiv="refresh" content="0;url=/?utm_source=direct&amp;utm_medium=web&amp;utm_content=waitlist#early-access"/>

</style>
